<?xml version="1.0" encoding="UTF-8"?>
<!--
  Polypus brand mark.
  A single continuous stroke that reads as an octopus arm reaching into a
  document stack - the visual shorthand for "documents in, postings out".

  Used by:
    - Components/Shared/BrandMark.razor  (inline SVG in the header/footer)
    - Polypus.Web/wwwroot/brand/polypus-mark.svg (favicon and downloads)

  Edit `stroke` colours here and in BrandMark.razor to rebrand.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" role="img" aria-label="Polypus">
  <defs>
    <linearGradient id="polypusArm" x1="8" y1="4" x2="34" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="40" height="40" rx="11" fill="#0d1017"/>
  <g fill="none" stroke="url(#polypusArm)" stroke-width="2.6" stroke-linecap="round">
    <path d="M11 13.5c0-3 2.4-5.5 5.4-5.5h5.2c3 0 5.4 2.5 5.4 5.5v3c0 3-2.4 5.4-5.4 5.4h-5.2"/>
    <path d="M11 13.5v13.2"/>
    <path d="M11 20.6h5.4c2.6 0 4.7 2.1 4.7 4.7v2.1"/>
  </g>
  <circle cx="11" cy="30.4" r="2.5" fill="#14b8a6"/>
</svg>
